name: Website

# Keeps https://litescapemc.pages.dev in step with main. The live demo at /demo/ is the real viewer,
# so viewer changes redeploy the site too.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - src/client/resources/web/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: website
      url: https://litescapemc.pages.dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Copy the viewer and fixture textures into website/public/demo
        run: node website/build.mjs
      - name: Deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: npx --yes wrangler@4.168.0 pages deploy --branch main --commit-hash "$SHA"
