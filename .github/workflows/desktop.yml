name: Desktop release

# Push a tag like desktop-v0.1.0 (matching desktop/package.json) to build the Electron app with the mod jar inside,
# attach it and the mod jar to this repo's vX.Y.Z release (create that release first),
# publish it on the public GA16-24/homebrew-tap repo and point the cask at it.
# PRs that touch the app only run the builds. Keep them out of required checks: the path filter means most PRs never run them.
on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mod:
    name: Mod jar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 25
      # No Gradle cache: this jar ships in release builds, so a poisoned cache must not reach it.
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-disabled: true
      - run: ./gradlew assemble
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.os }})
    needs: mod
    strategy:
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The app installs this jar into Minecraft instances (extraResources in package.json).
      - uses: actions/download-artifact@v8.0.2
        with:
          name: mod-jar
          path: build/libs
      - run: npm ci
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "desktop-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run dist
      # Release builds are ~550 MB per run, too much to keep for every PR push.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release and cask
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: homebrew-tap
    permissions:
      contents: write # upload the apps and mod jar to this repo's release
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: desktop-*
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: mod-jar
          path: mod
      - name: Attach the apps and mod jar to the Litescape release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          gh release upload "v$version" dist/* "mod/litescape-$version.jar" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Release on GA16-24/homebrew-tap and update Casks/litescape.rb
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          # Checksum first, so a renamed artifact fails the job before anything is published.
          sha() { sha256sum "dist/Litescape-$version-$1" | cut -d' ' -f1; }
          mac=$(sha mac-universal.dmg)
          x64=$(sha linux-x86_64.AppImage)
          arm=$(sha linux-arm64.AppImage)
          gh release create "v$version" dist/* --repo GA16-24/homebrew-tap --title "Litescape $version" \
            --notes "Desktop app for Litescape $version. Install with \`brew install --cask GA16-24/tap/litescape\`."

          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/GA16-24/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/litescape.rb <<EOF
          cask "litescape" do
            arch arm: "arm64", intel: "x86_64"
            platform_suffix = on_system_conditional macos: "mac-universal.dmg", linux: "linux-#{arch}.AppImage"

            version "$version"
            sha256 arm:          "$mac",
                   intel:        "$mac",
                   arm64_linux:  "$arm",
                   x86_64_linux: "$x64"

            on_macos do
              app "Litescape.app"

              # shortcut: the app is only ad-hoc signed, so Gatekeeper would block it; drop this once it is notarized.
              postflight_steps do
                run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{appdir}}/Litescape.app"]
              end

              zap trash: "~/Library/Application Support/Litescape"
            end
            on_linux do
              app_image "Litescape-#{version}-linux-#{arch}.AppImage", target: "Litescape.AppImage"

              zap trash: "~/.config/Litescape"
            end

            url "https://github.com/GA16-24/homebrew-tap/releases/download/v#{version}/Litescape-#{version}-#{platform_suffix}"
            name "Litescape"
            desc "Desktop viewer for Litematica schematics from the Litescape Minecraft mod"
            homepage "https://github.com/GA16-24/homebrew-tap"
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/litescape.rb
          git commit -m "litescape $version"
          git push
