name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: List Minecraft versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # One job per test.<Minecraft version> line in versions/*/gradle.properties, so new lines get CI without editing this file.
      - id: list
        run: |
          set -euo pipefail
          for f in versions/*/gradle.properties; do
            line=$(basename "$(dirname "$f")")
            sed -n "s/^test\.\([^=]*\)=.*/$line \1/p" "$f"
          done | jq -R -s -c 'split("\n")[:-1] | map(split(" ") | {line: .[0], minecraft: .[1]})' | sed 's/^/tests=/' >> "$GITHUB_OUTPUT"

  minecraft:
    name: Minecraft ${{ matrix.minecraft }}
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.tests) }}
    env:
      LINE: ${{ matrix.line }}
      MINECRAFT: ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # 25 builds every jar; 21 runs the 1.21.x production tests, as players' launchers do.
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            25
      # Also validates gradle-wrapper.jar checksums against the official Gradle releases.
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build with all javac lints as errors and Gradle deprecations as errors
        # --configure-on-demand: only this line's project, not all ten Minecraft setups (downloads, remapping) per job.
        run: .github/retry-downloads.sh ./gradlew ":$LINE:build" ":$LINE:compileGametestJava" --configure-on-demand --init-script .github/ci.init.gradle --warning-mode=fail --stacktrace
      - name: Install virtual display and software Vulkan/GL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers
      - name: Release jar in a production client and dedicated server
        run: .github/retry-downloads.sh ./gradlew ":$LINE:productionTest" "-Ptest_minecraft=$MINECRAFT" --configure-on-demand --init-script .github/ci.init.gradle --warning-mode=fail --stacktrace
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: minecraft-${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.line }}/build/reports/
            versions/${{ matrix.line }}/build/production/${{ matrix.minecraft }}/client/logs/
            versions/${{ matrix.line }}/build/production/${{ matrix.minecraft }}/client/screenshots/
            versions/${{ matrix.line }}/build/production/${{ matrix.minecraft }}/client/litweb-fixtures/
            versions/${{ matrix.line }}/build/production/${{ matrix.minecraft }}/server/logs/
          if-no-files-found: ignore
          retention-days: 7

  stonecutter:
    name: Version comments switch cleanly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6.4.1
      # Contributors switch src/ to another Minecraft version to work on it. A comment Stonecutter rewrites on the
      # way back shows up as a diff in their commit, so every switch has to come back byte for byte.
      - name: Switch src/ to every Minecraft version and back
        run: |
          set -euo pipefail
          for line in versions/*; do
            .github/retry-downloads.sh ./gradlew "Set active project to ${line#versions/}" -q
            .github/retry-downloads.sh ./gradlew "Reset active project" -q
            git diff --exit-code
          done

  gradle:
    # The required check: passes only when every Minecraft version above passed.
    name: Build, lint (-Werror) and client game test
    needs: minecraft
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.minecraft.result }}
        run: test "$RESULT" = success

  web:
    name: Web lint, format and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: biomejs/setup-biome@v2.7.1
        with:
          version: 2.6.6
      - name: Biome (lint + format + import order, warnings fail)
        run: biome ci --error-on-warnings .
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Node tests
        if: ${{ !cancelled() }} # report test results even when Biome already failed
        run: node --test 'web-dev/*.test.mjs' 'desktop/*.test.mjs' '.github/*.test.mjs'

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog 3.100.1
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/trufflesecurity/trufflehog@sha256:9c7a8325d43a4af2960d3f21d61a08981d8a1bf0542e007efa2e47097e386452
          git file:///repo --fail --no-update --results=verified,unknown

  workflows:
    name: Workflow lint, lockfile and security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12
        run: >-
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Verify actions.lock pins every action to its upstream commit
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.1
          gh actions-lock --verify
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
          version: 1.32.0
          persona: pedantic

  dependency-submission:
    name: Submit Gradle dependency graph
    # Fork PRs get a read-only token, so only pushes and same-repo PRs (incl. Dependabot) can submit.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the dependency graph API needs it; feeds Dependabot alerts and dependency review
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/dependency-submission@v6.4.1

  dependency-review:
    name: Dependency review
    needs: dependency-submission
    # Like code scanning, dependency review needs paid GitHub Code Security on private repos.
    if: ${{ !cancelled() && !failure() && github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # For .github/dependency-review.yml.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          # Allows the advisories in libraries Minecraft ships with the game, generated by .github/minecraft-advisories.mjs.
          config-file: ./.github/dependency-review.yml
          # Wait for the Gradle snapshot only when dependency-submission actually ran.
          retry-on-snapshot-warnings: ${{ needs.dependency-submission.result == 'success' }}
