name: Modrinth page

on:
  push:
    branches: [main]
    paths:
      - README.md
      - src/main/resources/assets/litweb/icon.png
      - .github/modrinth.mjs
      - .github/workflows/modrinth.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Push the README and icon to Modrinth
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # MODRINTH_TOKEN lives in this environment: a Modrinth personal access token with the Write projects scope.
    environment: modrinth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node .github/modrinth.mjs
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
