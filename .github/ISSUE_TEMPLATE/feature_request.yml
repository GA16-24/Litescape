name: Feature request
description: Suggest a change. Agree on it here before anyone writes a PR.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature PRs need an issue the maintainer agreed to first; see [CONTRIBUTING.md](https://github.com/GA16-24/Litescape/blob/main/CONTRIBUTING.md). Support for other mod loaders or Minecraft versions is out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and what gets in the way. Describe the problem before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you'd like it to work. Sketches and screenshots welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds
      description: What you do today instead, if anything.
