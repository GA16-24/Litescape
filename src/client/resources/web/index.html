<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Litematica Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 9.5v13L16 29 4 22.5v-13z' fill='%236e8bff'/%3E%3Cpath d='M16 16 28 9.5M16 16v13M16 16 4 9.5' stroke='%23fff' stroke-opacity='.55' stroke-width='1.5' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Views">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-name">Litematica Viewer</span>
        <span class="conn" id="conn" role="status"><span class="dot"></span><span class="conn-text">Connecting…</span></span>
      </div>
      <button class="search" id="open-palette" type="button">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search or run a command</span>
        <kbd class="kbd" data-mod>K</kbd>
      </button>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="foot"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="toggle-sidebar" type="button" aria-label="Toggle sidebar" data-tip="Sidebar" data-key="mod+B">
          <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
        </button>
        <div class="crumbs" id="crumbs"></div>
        <div class="chips" id="chips"></div>
        <div class="spacer"></div>
        <div class="actions">
          <button class="icon-btn" id="act-refresh" type="button" aria-label="Reload view" data-tip="Reload" data-key="R">
            <svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          </button>
          <button class="icon-btn" id="act-fit" type="button" aria-label="Fit to view" data-tip="Fit to view" data-key="F">
            <svg class="i" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>
          </button>
          <button class="icon-btn" id="act-shot" type="button" aria-label="Save screenshot" data-tip="Screenshot" data-key="S">
            <svg class="i" viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
          </button>
          <button class="icon-btn" id="toggle-inspector" type="button" aria-label="Toggle details panel" data-tip="Details" data-key="I">
            <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/></svg>
          </button>
        </div>
      </header>

      <section class="stage" id="stage">
        <canvas id="gl" aria-label="3D view of the blocks"></canvas>
        <div class="overlay" id="overlay" hidden></div>
        <div class="hover-card" id="hover" hidden></div>
        <div class="compass" id="compass" aria-hidden="true"><span>N</span></div>
        <div class="layers" id="layers" hidden>
          <div class="seg" role="radiogroup" aria-label="Layer mode" id="layer-mode">
            <button type="button" role="radio" data-mode="all">All</button>
            <button type="button" role="radio" data-mode="below">Up to</button>
            <button type="button" role="radio" data-mode="single">Layer</button>
          </div>
          <div class="layer-slider" id="layer-slider-wrap">
            <output id="layer-value"></output>
            <input type="range" id="layer-slider" min="0" max="0" value="0" aria-label="Layer">
          </div>
        </div>
        <div class="hint" id="hint">Drag to orbit · Right-drag to pan · Scroll to zoom</div>
      </section>
    </main>

    <aside class="inspector" id="inspector" aria-label="Details"></aside>
  </div>

  <div class="palette-backdrop" id="palette" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette-input">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="palette-input" placeholder="Search views and commands…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-list">
        <kbd class="kbd">Esc</kbd>
      </div>
      <div class="palette-list" id="palette-list" role="listbox"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
