import java.time.Duration
import net.fabricmc.loom.task.RemapJarTask
import net.fabricmc.loom.task.prod.ClientProductionRunTask
import net.fabricmc.loom.task.prod.ServerProductionRunTask

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// Stonecutter runs this script once per subproject in versions/, whose gradle.properties holds that line's dependencies.
def obfuscated = sc.current.parsed < '26.1'
apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
// Unobfuscated Loom has no mod* configurations; on obfuscated versions they remap mod jars to Mojang names.
def mod = { String configuration -> obfuscated ? 'mod' + configuration.capitalize() : configuration }

version = "${project.mod_version}+${sc.current.version}"
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
	// LWJGL publishes every platform's natives here; Mojang's mirror has only the ones Minecraft uses.
	exclusiveContent {
		forRepository { mavenCentral() }
		filter {
			includeModule 'org.lwjgl', 'lwjgl-shaderc'
			includeModule 'org.lwjgl', 'lwjgl-spvc'
		}
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"litweb" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Adds the `gametest` source set and `runClientGameTest`: boots the real client, builds a scene,
	// drives Litematica and the web API end to end, and writes fixtures for the web dev server.
	configureTests {
		createSourceSet = true
		modId = "litweb-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (obfuscated) mappings loom.officialMojangMappings()
	add mod('implementation'), "net.fabricmc:fabric-loader:${project.loader_version}"
	add mod('implementation'), "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	add mod('clientImplementation'), "maven.modrinth:litematica:${project.litematica_version}"
	add mod('clientImplementation'), "maven.modrinth:malilib:${project.malilib_version}"
	// Optional at runtime: the client reads its public API only when it is installed. All rights reserved, so it is never bundled.
	add mod('clientCompileOnly'), "maven.modrinth:buildprint:${project.buildprint_version}"
	add mod('gametestImplementation'), "maven.modrinth:buildprint:${project.buildprint_version}"
	// Minecraft ships JSpecify's annotations from 1.21.11 on; the code uses them on every version.
	if (sc.current.parsed < '1.21.11') compileOnly 'org.jspecify:jspecify:1.0.0'
	// The shaders tab translates packs with LWJGL's shaderc and spvc, which Minecraft ships only from 26.2 on.
	// Before that, the jar carries them, built for this Minecraft's LWJGL and every platform Minecraft runs on.
	def lwjgl = findProperty('bundled_lwjgl')
	if (lwjgl) ['lwjgl-shaderc', 'lwjgl-spvc'].each { module ->
		clientImplementation "org.lwjgl:$module:$lwjgl"
		include "org.lwjgl:$module:$lwjgl"
		['linux', 'linux-arm64', 'macos', 'macos-arm64', 'windows', 'windows-arm64'].each { platform ->
			clientRuntimeOnly "org.lwjgl:$module:$lwjgl:natives-$platform"
			include "org.lwjgl:$module:$lwjgl:natives-$platform"
		}
	}
}

processResources {
	def props = [version: project.version, minecraft: project.minecraft_dependency]
	inputs.properties props
	filesMatching("fabric.mod.json") { expand props }
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
	// 1.21.x runs on Java 21, so every jar targets it.
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

// 1.21.11 renamed ResourceLocation to Identifier and ResourceKey.location() to identifier(), and moved Util into util.
stonecutter {
	replacements.perl(sc.current.parsed < '1.21.11') {
		replace '\\bIdentifier\\b', 'ResourceLocation', '\\bResourceLocation\\b', 'Identifier'
		replace '\\bnet\\.minecraft\\.util\\.Util\\b', 'net.minecraft.Util', '\\bnet\\.minecraft\\.Util\\b', 'net.minecraft.util.Util'
		replace '(dimension\\(\\)|getKey\\(\\))\\.identifier\\(\\)', '$1.location()', '(dimension\\(\\)|getKey\\(\\))\\.location\\(\\)', '$1.identifier()'
	}
}

// 1.21.5 turned BakedQuad into a record, so before it the accessors are getters.
stonecutter {
	replacements.perl(sc.current.parsed < '1.21.5') {
		replace '\\bq\\.(sprite|tintIndex|direction|vertices)\\(\\)', 'q.get\\u$1()', '\\bq\\.get(Sprite|TintIndex|Direction|Vertices)\\(\\)', 'q.\\l$1()'
		replace '\\bq\\.shade\\(\\)', 'q.isShade()', '\\bq\\.isShade\\(\\)', 'q.shade()'
	}
}

// The jar players install. Copied to the root build/libs, where the desktop app and the release workflow pick up every version's jar.
def modJar = tasks.named(obfuscated ? 'remapJar' : 'jar')
tasks.register('collectJar', Copy) {
	from modJar
	into rootProject.layout.buildDirectory.dir('libs')
}
tasks.named('assemble') { dependsOn 'collectJar' }

// The production test runs the jar above in a real Fabric install, as a player would, on one Minecraft version from
// this subproject's test.<version> lines: its own minecraft_version, or the one -Ptest_minecraft=<version> names. Loom's production
// runs support one target version per build, so each tested version is its own Gradle invocation (and CI job).
def gametestJar = tasks.register('gametestJar', Jar) {
	from sourceSets.gametest.output
	archiveClassifier = obfuscated ? 'gametest-dev' : 'gametest'
}
def testMod = obfuscated ? tasks.register('remapGametestJar', RemapJarTask) {
	inputFile = gametestJar.flatMap { it.archiveFile }
	classpath.from sourceSets.gametest.compileClasspath
	archiveClassifier = 'gametest'
	addNestedDependencies = false
} : gametestJar

def tests = [:]
def versionProperties = new Properties()
file('gradle.properties').withInputStream { versionProperties.load(it) }
versionProperties.stringPropertyNames().findAll { it.startsWith('test.') }.each { key ->
	def (fabricApiVersion, buildprint) = versionProperties[key].split(/\s+/)
	tests[key.substring('test.'.length())] = [fabricApi: fabricApiVersion, buildprint: buildprint]
}
def mc = findProperty('test_minecraft') ?: project.minecraft_version
def productionTests = tasks.register('productionTest') {
	group = 'verification'
	description = "Runs the end-to-end test in a production client and boots a production dedicated server on Minecraft $mc."
}
// A version another subproject covers: nothing to run here.
if (tests[mc]) {
	def fabricApiJar = configurations.detachedConfiguration(dependencies.create("net.fabricmc.fabric-api:fabric-api:${tests[mc].fabricApi}"))
	def clientMods = configurations.detachedConfiguration(
		// Fabric API's release jar leaves out its test modules.
		fabricApi.module('fabric-client-gametest-api-v1', tests[mc].fabricApi),
		dependencies.create("maven.modrinth:litematica:${project.litematica_version}"),
		dependencies.create("maven.modrinth:malilib:${project.malilib_version}"),
		dependencies.create("maven.modrinth:buildprint:${tests[mc].buildprint}"))
	[fabricApiJar, clientMods]*.transitive = false
	// The Java players run: 1.21.x launchers ship Java 21, 26.x needs 25.
	def java = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(mc.startsWith('1.') ? 21 : 25) }
	def runs = layout.buildDirectory.dir("production/$mc")

	def client = tasks.register('productionClientTest', ClientProductionRunTask) {
		minecraftVersion = mc
		mods.from modJar, testMod, fabricApiJar, clientMods
		javaLauncher = java
		def dir = runs.map { it.dir('client') }
		runDir = dir
		jvmArgs.add '-Dfabric.client.gametest'
		// A separate home and temp folder keep the test away from the developer's ~/.litescape, and make LWJGL
		// extract the natives this jar bundles instead of reusing ones another Minecraft version left behind.
		jvmArgs.add dir.map { "-Duser.home=${it.dir('home').asFile}".toString() }
		jvmArgs.add dir.map { "-Djava.io.tmpdir=${it.dir('tmp').asFile}".toString() }
		timeout = Duration.ofMinutes(20)
		def passed = dir.map { it.file('litweb-fixtures/passed') }
		// A fresh game folder every run, as in CI: Litematica would otherwise restore an earlier run's placements.
		doFirst {
			dir.get().asFile.deleteDir()
			dir.get().dir('tmp').asFile.mkdirs()
		}
		doLast { if (!passed.get().asFile.exists()) throw new GradleException("The end-to-end test did not finish on Minecraft $mc") }
	}
	def server = tasks.register('productionServerTest', ServerProductionRunTask) {
		minecraftVersion = mc
		loaderVersion = project.loader_version
		installerVersion = project.installer_version
		mods.from modJar, testMod, fabricApiJar
		javaLauncher = java
		def dir = runs.map { it.dir('server') }
		runDir = dir
		jvmArgs.add '-Dlitweb.serverSmokeTest=true'
		timeout = Duration.ofMinutes(10)
		doFirst {
			def d = dir.get().asFile
			d.mkdirs()
			new File(d, 'eula.txt').text = 'eula=true\n'
			new File(d, 'server.properties').text = 'server-port=0\nlevel-type=minecraft\\:flat\n'
			new File(d, 'litweb-server-ok').delete()
		}
		doLast { if (!new File(dir.get().asFile, 'litweb-server-ok').exists()) throw new GradleException("The dedicated server did not start with the mod on Minecraft $mc") }
	}
	productionTests.configure { dependsOn client, server }
}

// Serves /api/shaders without Minecraft, for web-dev/serve.mjs: ./gradlew :26.3:shaderDev [-Ppacks=<shaderpacks folder>]
tasks.register('shaderDev', JavaExec) {
	group = 'development'
	classpath = sourceSets.gametest.runtimeClasspath
	mainClass = 'dev.ga16.litweb.test.ShaderDev'
	args = ['8195', project.findProperty('packs') ?: rootProject.file('run/shaderpacks').path, layout.buildDirectory.file('shader-dev-settings.json').get().asFile.path]
}
