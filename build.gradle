plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"litweb" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Adds the `gametest` source set and `runClientGameTest`: boots the real client, builds a scene,
	// drives Litematica and the web API end to end, and writes fixtures for the web dev server.
	configureTests {
		createSourceSet = true
		modId = "litweb-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	clientImplementation "maven.modrinth:litematica:${project.litematica_version}"
	clientImplementation "maven.modrinth:malilib:${project.malilib_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

// Serves /api/shaders without Minecraft, for web-dev/serve.mjs: ./gradlew shaderDev [-Ppacks=<shaderpacks folder>]
tasks.register('shaderDev', JavaExec) {
	group = 'development'
	classpath = sourceSets.gametest.runtimeClasspath
	mainClass = 'dev.ga16.litweb.test.ShaderDev'
	args = ['8195', project.findProperty('packs') ?: file('run/shaderpacks').path, layout.buildDirectory.file('shader-dev-settings.json').get().asFile.path]
}

