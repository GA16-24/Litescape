<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Litescape</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #171a21; --muted: #5d6472; --accent: #4f6ef7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171a21; --fg: #e8eaf0; --muted: #9aa1ae; --accent: #6e8bff; } }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, sans-serif; text-align: center; }
  h1 { font-size: 18px; font-weight: 600; margin: 16px 0 4px; }
  p { margin: 0; color: var(--muted); max-width: 360px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin: 0 auto;
    animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="dot" aria-hidden="true"></div>
  <h1>Waiting for Minecraft</h1>
  <p>Start Minecraft with the Litescape mod. The viewer opens here once you're in a world.</p>
</main>
</body>
</html>
