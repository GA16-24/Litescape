<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>Settings</title>
<style>
  /* the viewer's T3 Code tokens (style.css), so this window matches its Settings dialog */
  :root { color-scheme: light dark; --bg: #fcfcfc; --card: #fff; --text: #18181b; --muted: #71717a; --faint: #a1a1aa;
    --border: #e4e4e7; --hover: rgba(0, 0, 0, .04); --danger: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #111; --text: #f5f5f5; --muted: #a3a3a3;
    --faint: #737373; --border: rgba(255, 255, 255, .08); --hover: rgba(255, 255, 255, .04); --danger: #fb414a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 28px 20px 40px; }
  .head { display: flex; align-items: center; gap: 12px; margin: 0 16px 4px; }
  h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; }
  .lead { margin: 0 16px 12px; color: var(--muted); font-size: 12px; }
  ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--card);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .05); }
  li { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 12px 16px; }
  li + li { border-top: 1px solid var(--border); }
  li svg { flex: none; width: 16px; height: 16px; color: var(--faint); fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round; }
  li > div { flex: 1; min-width: 0; font-weight: 500; }
  li p { margin: 2px 0 0; color: var(--muted); font-size: 12px; font-weight: 400; overflow-wrap: anywhere; }
  li.empty { color: var(--muted); font-size: 13px; }
  button { font: 500 13px/1 inherit; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; }
  button:hover { background: var(--hover); }
  button.danger:hover { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid #346bf1; outline-offset: 1px; }
  #error { margin: 10px 16px 0; color: var(--danger); font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1 id="folders-title">Instance folders</h1>
    <button id="add" type="button">Add folder…</button>
  </div>
  <p class="lead">Litescape finds instances from the usual launchers by itself. Add a folder here if yours isn't listed.</p>
  <ul id="list" aria-labelledby="folders-title"></ul>
  <p id="error" role="alert"></p>
</main>
<script src="settings.js"></script>
</body>
</html>
